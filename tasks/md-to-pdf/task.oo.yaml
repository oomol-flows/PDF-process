inputs_def:
  - handle: md_content
    description: Markdown content to convert
    json_schema:
      type: string
      ui:widget: text
    nullable: false

  - handle: title
    description: Document title
    json_schema:
      type: string
    value:
    nullable: true

  - handle: font_size
    description: Base font size
    json_schema:
      type: number
      enum:
        - 10
        - 11
        - 12
        - 14
        - 16
      ui:options:
        labels:
          - 10pt (Small)
          - 11pt (Normal)
          - 12pt (Large)
          - 14pt (Extra Large)
          - 16pt (Huge)
    value: 11
    nullable: false

  - handle: output_path
    description: Output PDF file path (optional, uses session dir if not set)
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: PDF
            extensions:
              - pdf
        excludeAll: true
    value:
    nullable: true

outputs_def:
  - handle: pdf_path
    json_schema:
      type: string
    description: "Generated PDF file path"
    nullable: false

executor:
  name: python
  options:
    entry: __init__.py

title: "Markdown to PDF"
icon: ":carbon:document-pdf:"
description: "Convert Markdown to PDF using WeasyPrint with OTF font support"
