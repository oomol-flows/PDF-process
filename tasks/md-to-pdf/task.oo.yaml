inputs_def:
  - handle: md_content
    description: "%markdown-content-to-convert2%"
    json_schema:
      type: string
      ui:widget: text
    nullable: false

  - handle: title
    description: "%document-title2%"
    json_schema:
      type: string
    value:
    nullable: true

  - handle: font_size
    description: "%base-font-size3%"
    json_schema:
      type: number
      enum:
        - 10
        - 11
        - 12
        - 14
        - 16
      ui:options:
        labels:
          - 10pt (Small)
          - 11pt (Normal)
          - 12pt (Large)
          - 14pt (Extra Large)
          - 16pt (Huge)
    value: 11
    nullable: false

  - handle: output_path
    description: "%output-pdf-file-path-optional-uses-session-dir-if-not-set2%"
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: PDF
            extensions:
              - pdf
        excludeAll: true
    value:
    nullable: true

outputs_def:
  - handle: pdf_path
    description: "%generated-pdf-file-path3%"
    json_schema:
      type: string
    nullable: false

executor:
  name: python
  options:
    entry: __init__.py

title: "%markdown-to-pdf%"
icon: ":carbon:document-pdf:"
description: "%convert-markdown-to-pdf-using-weasyprint-with-otf-font-support%"
