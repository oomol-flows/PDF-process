inputs_def:
  - handle: text
    description: Text content to convert to PDF
    json_schema:
      type: string
      ui:widget: textarea
    nullable: false

  - handle: title
    description: Document title (optional)
    json_schema:
      type: string
    value:
    nullable: true

  - handle: font_size
    description: Base font size
    json_schema:
      type: number
      enum:
        - 10
        - 11
        - 12
        - 14
        - 16
      ui:options:
        labels:
          - 10pt (Small)
          - 11pt (Normal)
          - 12pt (Large)
          - 14pt (Heading)
          - 16pt (Title)
    value: 11
    nullable: false

  - handle: color_scheme
    description: Color scheme for the document
    json_schema:
      type: string
      enum:
        - elegant-blue
        - warm-earth
        - modern-dark
        - classic-serif
        - minimal-gray
      ui:options:
        labels:
          - Elegant Blue
          - Warm Earth
          - Modern Dark
          - Classic Serif
          - Minimal Gray
    value: elegant-blue
    nullable: false

  - handle: output_path
    description: Output PDF file path
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: PDF
            extensions:
              - pdf
        excludeAll: true
    value:
    nullable: true

outputs_def:
  - handle: pdf_path
    json_schema:
      type: string
    description: "Generated PDF file path"
    nullable: false

executor:
  name: python
  options:
    entry: __init__.py

title: "Text to PDF"
icon: ":carbon:document-pdf:"
description: "Convert text to beautifully formatted PDF with elegant typography
  and color schemes"
