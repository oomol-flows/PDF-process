inputs_def:
  - handle: text
    description: "%text-content-to-convert%"
    json_schema:
      type: string
      ui:widget: textarea
    nullable: false

  - handle: title
    description: "%document-title-optional%"
    json_schema:
      type: string
    value:
    nullable: true

  - handle: font_size
    description: "%base-font-size%"
    json_schema:
      type: number
      enum:
        - 10
        - 11
        - 12
        - 14
        - 16
      ui:options:
        labels:
          - 10pt (Small)
          - 11pt (Normal)
          - 12pt (Large)
          - 14pt (Heading)
          - 16pt (Title)
    value: 11
    nullable: false

  - handle: color_scheme
    description: "%color-scheme-for-document%"
    json_schema:
      type: string
      enum:
        - elegant-blue
        - warm-earth
        - modern-dark
        - classic-serif
        - minimal-gray
      ui:options:
        labels:
          - Elegant Blue
          - Warm Earth
          - Modern Dark
          - Classic Serif
          - Minimal Gray
    value: elegant-blue
    nullable: false

  - handle: output_path
    description: "%output-pdf-file-path-optional%"
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: PDF
            extensions:
              - pdf
        excludeAll: true
    value:
    nullable: true

outputs_def:
  - handle: pdf_path
    json_schema:
      type: string
    description: "%generated-pdf-file-path%"
    nullable: false

executor:
  name: python
  options:
    entry: __init__.py

title: "%text-to-pdf%"
icon: ":carbon:document-pdf:"
description: "%convert-text-to-beautifully-formatted-pdf%"
