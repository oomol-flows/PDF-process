          ## Bash Example

          ```bash
          #!/bin/bash
          set -e

          PROJECT_NAME="my-app"
          BUILD_DIR="./dist"

          echo "Building $PROJECT_NAME..."
          mkdir -p "$BUILD_DIR"
          npm run build
