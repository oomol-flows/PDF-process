      - handle: md_content
        value: |
          # Syntax Highlighting Demo

          This PDF demonstrates **syntax highlighting** for code blocks.

          ## Python Example

          ```python
          from typing import List, Optional

          def fibonacci(n: int) -> List[int]:
              """Generate Fibonacci sequence up to n terms."""
              if n <= 0:
                  return []
              
              sequence = [0, 1]
              for i in range(2, n):
                  sequence.append(sequence[i-1] + sequence[i-2])
              
              return sequence[:n]

          # Usage
          result = fibonacci(10)
          print(f"Fibonacci: {result}")
          ```

          ## JavaScript Example

          ```javascript
          class Calculator {
              constructor() {
                  this.result = 0;
              }

              add(a, b) {
                  return a + b;
              }

              async fetchData(url) {
                  const response = await fetch(url);
                  return response.json();
              }
          }

          const calc = new Calculator();
          console.log(calc.add(5, 3)); // Output: 8
          ```

          ## TypeScript Example

          ```typescript
          interface User {
              id: number;
              name: string;
              email: string;
          }

          function greet(user: User): string {
              return `Hello, ${user.name}!`;
          }

          const admin: User = {
              id: 1,
              name: "Alice",
              email: "alice@example.com"
          };
          ```

