          # 欢迎使用 OOMOL PDF 生成器

          这是一个格式精美的 PDF 文档，支持中文字体渲染。

          ## 功能特点

          - 多种配色方案
          - 清晰的排版
          - 专业的布局
          - 完美支持中文

          > 好的设计显而易见，伟大的设计透明无痕。

          This document demonstrates Chinese font support using Source Han Sans SC.
      - handle: title
        value: "中文 PDF 测试"
      - handle: font_size
        value: 11
      - handle: color_scheme
        value: "elegant_blue"
      - handle: output_path
        value:
        nullable: true
